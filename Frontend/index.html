<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A0E67" />

    <title>LizExpress — Swap What You Have for What You Need</title>
    <meta name="description" content="Nigeria's swap marketplace. List what you no longer need, say what you want in return, and trade without cash." />

    <!--
      Performance: fonts are the single biggest render-blocker on a marketplace.
      Preconnect opens the TLS handshake early; the stylesheet loads async via
      the print/onload swap so it never blocks first paint. display=swap means
      text is visible immediately in the fallback face.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="dns-prefetch" href="https://checkout.flutterwave.com" />
    <!-- LCP element: the first carousel slide. Preloaded so it is not queued behind the bundle. -->
    <link rel="preload" as="image" href="/hero/3.webp" type="image/webp" fetchpriority="high" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@300,400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@300,400,500,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@300,400,500,700&display=swap" />
    </noscript>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://lizexpressltd.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lizexpressltd.com/" />
    <meta property="og:title" content="LizExpress — Swap What You Have for What You Need" />
    <meta property="og:description" content="Nigeria's swap marketplace. Trade goods and services without cash." />
    <meta property="og:image" content="https://lizexpressltd.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@lizexpressltd" />

    <meta name="geo.region" content="NG-KN" />
    <meta name="geo.placename" content="Kano" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LizExpress Ltd",
        "url": "https://lizexpressltd.com",
        "logo": "https://lizexpressltd.com/logo-wordmark@2x.png",
        "address": { "@type": "PostalAddress", "addressLocality": "Kano", "addressCountry": "Nigeria" },
        "sameAs": [
          "https://www.instagram.com/lizexpressltd/",
          "https://www.facebook.com/lizexpressltd",
          "https://x.com/lizexpressltd"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Flutterwave checkout. Deferred so it never blocks first paint — the
      payment screen checks for window.FlutterwaveCheckout and shows a clear
      error if it has not loaded, rather than failing silently.
      Only the PUBLIC key is ever passed to it; the secret stays on the server.
    -->
    <script src="https://checkout.flutterwave.com/v3.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
