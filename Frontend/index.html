<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A0E67" />

    <title>LizExpress — Swap What You Have for What You Need</title>
    <meta
      name="description"
      content="Nigeria's swap marketplace. List what you no longer need, say what you want in return, and find vendors and services near you."
    />

    <!--
      TYPE SYSTEM
      Archivo for everything readable, IBM Plex Mono for data, Material Symbols
      Rounded for every icon in the product.

      Loading strategy, in order of importance:

      • Archivo is render-blocking ON PURPOSE. It is the body face; swapping it
        in after first paint reflows every line of text on the page. One short
        block is cheaper than a full-page reflow.

      • Material Symbols loads async (the print/onload swap). Icons appearing a
        beat late is invisible; blocking first paint on a 2MB icon font is not.

      • icon_names= subsets the icon font to the glyphs this app actually uses.
        The unsubsetted file is roughly 2.5MB; this is around 15KB. KEEP THIS
        LIST IN SYNC — an icon that is used but not listed renders as its own
        name in plain text, which is immediately obvious in review.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance,account_circle,add,add_a_photo,add_photo_alternate,agriculture,apparel,arrow_back,arrow_forward,arrow_outward,bookmark,build,call,campaign,cancel,celebration,chair,chat,chat_bubble,check,check_circle,chevron_left,chevron_right,close,construction,content_copy,credit_card,dashboard,delete,description,dialpad,directions_car,download,edit,error,expand_more,face_retouching_natural,favorite,filter_list,flag,group,help,history,home,id_card,image,image_not_supported,info,inventory_2,language,local_shipping,location_on,lock,login,logout,mail,medication,menu,more_vert,notifications,open_in_new,payments,person,photo_camera,photo_library,place,receipt_long,refresh,restaurant,schedule,school,search,send,settings,share,shopping_bag,smartphone,star,storefront,swap_horiz,sync,trending_down,trending_up,tune,verified,visibility,visibility_off,warning,whatsapp"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0"
      />
    </noscript>

    <link rel="dns-prefetch" href="https://checkout.flutterwave.com" />
    <!-- LCP element: the first carousel slide. Preloaded so it is not queued behind the bundle. -->
    <link rel="preload" as="image" href="/hero/3.webp" type="image/webp" fetchpriority="high" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://lizexpressltd.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lizexpressltd.com/" />
    <meta property="og:title" content="LizExpress — Swap What You Have for What You Need" />
    <meta
      property="og:description"
      content="Nigeria's swap marketplace. Trade goods without cash, and find vendors and services near you."
    />
    <meta property="og:image" content="https://lizexpressltd.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@lizexpressltd" />

    <meta name="geo.region" content="NG-KN" />
    <meta name="geo.placename" content="Kano" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LizExpress Ltd",
        "url": "https://lizexpressltd.com",
        "logo": "https://lizexpressltd.com/logo-wordmark@2x.png",
        "address": { "@type": "PostalAddress", "addressLocality": "Kano", "addressCountry": "Nigeria" },
        "sameAs": [
          "https://www.instagram.com/lizexpressltd/",
          "https://www.facebook.com/lizexpressltd",
          "https://x.com/lizexpressltd"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Flutterwave checkout. Deferred so it never blocks first paint — the
      payment screen checks for window.FlutterwaveCheckout and shows a clear
      error if it has not loaded, rather than failing silently.
      Only the PUBLIC key is ever passed to it; the secret stays on the server.
    -->
    <script src="https://checkout.flutterwave.com/v3.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
