# ═══════════════════════════════════════════════════════════
#  Path aggregator. Referenced by openapi.yaml.
#  Each module lives in its own file so endpoints stay easy to
#  find and review — none of this is generated from code comments.
# ═══════════════════════════════════════════════════════════

# System
/health:        { $ref: './system.yaml#/~1health' }
/testimonials:  { $ref: './system.yaml#/~1testimonials' }
/feedback:      { $ref: './system.yaml#/~1feedback' }

